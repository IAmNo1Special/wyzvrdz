name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: IAmNo1Special/actions/.github/workflows/python-ci.yml@v1
    with:
      python-version: "3.13"
      run-tests: false
      lint-commands: |
        uv run ruff check .
        uv run ruff format --check .
        pip install -q mdformat==0.7.22 mdformat-gfm mdformat-frontmatter mdformat-tables mdformat-wikilink
        mdformat --check $(git ls-files '*.md')
